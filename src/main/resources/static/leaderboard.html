<!DOCTYPE html>

<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>MundialScore - Tabla de Posiciones</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#30e87a",
                        "primary-dark": "#25b860",
                        "background-light": "#f6f8f7",
                        "background-dark": "#112117",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2c22",
                        "text-main": "#0e1b13",
                        "text-secondary": "#4e976b",
                        "accent-gold": "#fbbf24",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "sans-serif"],
                    },
                },
            },
        }
    </script>
</head>

<body
    class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display text-text-main dark:text-gray-100">
    <header
        class="sticky top-0 z-50 flex items-center justify-between border-b border-[#e7f3ec] dark:border-gray-800 bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur-sm px-6 lg:px-10 py-3 shadow-sm transition-colors duration-200">
        <div class="flex items-center gap-4">
            <h2 class="text-text-main dark:text-white text-xl font-bold leading-tight tracking-tight">MundialScore</h2>
        </div>
        <nav class="hidden md:flex items-center gap-8">
            <a class="text-primary font-semibold text-sm leading-normal hover:text-primary-dark transition-colors"
                href="dashboard.html">Inicio</a>
            <a class="text-text-main dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary transition-colors"
                href="matches.html">Partidos</a>
            <a class="text-text-main dark:text-gray-300 text-sm font-medium leading-normal hover:text-primary transition-colors"
                href="leaderboard.html">Ranking</a>
        </nav>
    </header>
    <main class="flex-1 w-full max-w-[1200px] mx-auto px-4 md:px-8 py-8 lg:py-12">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div class="flex flex-col gap-2">
                <h1 class="text-text-main dark:text-white text-3xl md:text-4xl font-black leading-tight tracking-tight">
                    Tabla de Posiciones</h1>
            </div>
        </div>

        <div
            class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-sm border border-[#e7f3ec] dark:border-gray-800 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 dark:bg-gray-800 text-xs text-text-secondary uppercase">
                    <tr>
                        <th class="px-6 py-4">Posición</th>
                        <th class="px-6 py-4">Usuario</th>
                        <th class="px-6 py-4">Puntos</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3" class="px-6 py-4 text-center">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        const authHeader = localStorage.getItem('authHeader');
        if (!authHeader) window.location.href = 'login.html';

        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard', {
                    headers: { 'Authorization': authHeader }
                });
                if (response.ok) {
                    const data = await response.json();
                    renderLeaderboard(data);
                } else {
                    if (response.status === 401) window.location.href = 'login.html';
                }
            } catch (e) {
                console.error(e);
                document.getElementById('leaderboard-body').innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center text-red-500">Error al cargar tabla</td></tr>';
            }
        }

        function renderLeaderboard(data) {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="px-6 py-4 text-center">No hay datos aún.</td></tr>';
                return;
            }

            data.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'border-b border-[#e7f3ec] dark:border-gray-800 last:border-0 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors';

                let rankDisplay = index + 1;
                if (index === 0) rankDisplay = '🥇';
                if (index === 1) rankDisplay = '🥈';
                if (index === 2) rankDisplay = '🥉';

                tr.innerHTML = `
                <td class="px-6 py-4 font-bold ${index < 3 ? 'text-primary' : ''}">${rankDisplay}</td>
                <td class="px-6 py-4 font-medium text-text-main dark:text-white">${row.username}</td>
                <td class="px-6 py-4 font-bold text-accent-gold">${row.score}</td>
            `;
                tbody.appendChild(tr);
            });
        }

        loadLeaderboard();
    </script>
</body>

</html>
